<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SolveItAI Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top, #18345f, #050914 55%, #02040a);
            color: white;
        }

        .box {
            width: 390px;
            max-width: 92%;
            padding: 35px;
            border-radius: 22px;
            background: rgba(10, 18, 35, 0.94);
            border: 1px solid rgba(80, 160, 255, 0.35);
            box-shadow: 0 0 45px rgba(0, 120, 255, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .logo span {
            color: #38aaff;
        }

        .subtitle {
            text-align: center;
            color: #9ba9bd;
            margin-bottom: 28px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 14px;
            border-radius: 12px;
            border: 1px solid #263a58;
            background: #0b1424;
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #38aaff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #168cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0878df;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            color: #9ba9bd;
        }

        .switch span {
            color: #38aaff;
            cursor: pointer;
            font-weight: bold;
        }

        .message {
            text-align: center;
            min-height: 22px;
            margin-top: 15px;
            color: #ff7070;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">
        Solve<span>It</span>AI
    </div>

    <div class="subtitle">
        Your AI problem solving assistant
    </div>


    <!-- LOGIN -->

    <div id="loginForm">

        <input
            id="loginEmail"
            type="email"
            placeholder="Email"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Password"
        >

        <button onclick="login()">
            Login
        </button>

        <div class="switch">
            Don't have an account?
            <span onclick="showRegister()">
                Create Account
            </span>
        </div>

    </div>


    <!-- REGISTER -->

    <div id="registerForm" class="hidden">

        <input
            id="registerName"
            type="text"
            placeholder="Full Name"
        >

        <input
            id="registerEmail"
            type="email"
            placeholder="Email"
        >

        <input
            id="registerPassword"
            type="password"
            placeholder="Password (minimum 6 characters)"
        >

        <button onclick="register()">
            Create Account
        </button>

        <div class="switch">
            Already have an account?
            <span onclick="showLogin()">
                Login
            </span>
        </div>

    </div>


    <div id="message" class="message"></div>

</div>


<script>

function showRegister() {

    document
        .getElementById("loginForm")
        .classList.add("hidden");

    document
        .getElementById("registerForm")
        .classList.remove("hidden");

    document
        .getElementById("message")
        .textContent = "";
}


function showLogin() {

    document
        .getElementById("registerForm")
        .classList.add("hidden");

    document
        .getElementById("loginForm")
        .classList.remove("hidden");

    document
        .getElementById("message")
        .textContent = "";
}


async function register() {

    const name =
        document.getElementById("registerName").value;

    const email =
        document.getElementById("registerEmail").value;

    const password =
        document.getElementById("registerPassword").value;

    const message =
        document.getElementById("message");

    if (!name || !email || !password) {
        message.textContent =
            "Please fill all fields.";
        return;
    }

    try {

        const response = await fetch(
            "/api/auth/register",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name,
                    email,
                    password
                })
            }
        );

        const data =
            await response.json();

        if (!response.ok) {
            message.textContent =
                data.error || "Registration failed.";
            return;
        }

        message.style.color = "#45e69a";

        message.textContent =
            "Account created successfully!";

        setTimeout(() => {
            showLogin();
        }, 1000);

    } catch (error) {

        message.textContent =
            "Server connection failed.";
    }
}


async function login() {

    const email =
        document.getElementById("loginEmail").value;

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("message");

    if (!email || !password) {
        message.textContent =
            "Enter email and password.";
        return;
    }

    try {

        const response = await fetch(
            "/api/auth/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email,
                    password
                })
            }
        );

        const data =
            await response.json();

        if (!response.ok) {
            message.textContent =
                data.error || "Login failed.";
            return;
        }

        localStorage.setItem(
            "solveitai_token",
            data.token
        );

        localStorage.setItem(
            "solveitai_user",
            JSON.stringify(data.user)
        );

        message.style.color = "#45e69a";

        message.textContent =
            "Login successful!";

        setTimeout(() => {
            window.location.href = "/";
        }, 500);

    } catch (error) {

        message.textContent =
            "Server connection failed.";
    }
}

</script>

</body>
</html>
