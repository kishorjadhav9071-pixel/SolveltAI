<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SolveItAI Chess</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#292929 0%,#111 48%,#050505 100%);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    width:100%;
    max-width:1100px;
    padding:18px;
}

/* TOP */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:18px;
}

.logo{
    font-size:25px;
    font-weight:800;
}

.logo span{
    color:#999;
}

.modeBadge{
    font-size:11px;
    margin-left:7px;
    padding:4px 8px;
    border-radius:8px;
    background:#fff;
    color:#000;
}

.status{
    background:#fff;
    color:#000;
    padding:10px 17px;
    border-radius:12px;
    font-weight:700;
    min-width:190px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.35);
}

/* GAME */

.gameLayout{
    display:grid;
    grid-template-columns:210px minmax(300px,680px) 210px;
    gap:18px;
    align-items:center;
    justify-content:center;
}

/* PLAYER */

.playerCard{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    padding:16px;
    backdrop-filter:blur(10px);
    min-height:155px;
}

.playerTop{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
}

.playerIcon{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    background:#fff;
    color:#000;
}

.playerName{
    font-size:17px;
    font-weight:800;
}

.playerSide{
    font-size:12px;
    color:#999;
    margin-top:3px;
}

.captureTitle{
    color:#888;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:7px;
}

.captured{
    min-height:32px;
    display:flex;
    flex-wrap:wrap;
    gap:3px;
    align-items:center;
}

.captured span{
    font-size:21px;
}

.count{
    margin-top:12px;
    font-size:13px;
    color:#bbb;
}

.score{
    margin-top:5px;
    font-size:19px;
    font-weight:800;
}

/* BOARD */

.boardWrap{
    width:100%;
}

#board{
    width:100%;
    aspect-ratio:1;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    border:5px solid #fff;
    border-radius:7px;
    overflow:hidden;
    box-shadow:
        0 25px 70px rgba(0,0,0,.7),
        0 0 0 1px rgba(255,255,255,.2);
}

.square{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    aspect-ratio:1;
}

.whiteSquare{
    background:#fff;
}

.blackSquare{
    background:#000;
}

/* PIECES */

.piece{
    position:relative;
    z-index:5;
    pointer-events:none;
    font-family:
        "Segoe UI Symbol",
        "Arial Unicode MS",
        serif;
    font-size:clamp(34px,6.8vw,68px);
    line-height:1;
    transform:translateY(-2px);
    transition:.12s;
}

.square:hover .piece{
    transform:translateY(-4px) scale(1.03);
}

.whitePiece{
    color:#fff;
    text-shadow:
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000,
        2px 2px 0 #000,
        0 4px 7px rgba(0,0,0,.65);
}

.blackPiece{
    color:#000;
    text-shadow:
        -1.5px -1.5px 0 #fff,
        1.5px -1.5px 0 #fff,
        -1.5px 1.5px 0 #fff,
        1.5px 1.5px 0 #fff;
}

/* HIGHLIGHTS */

.selected{
    box-shadow:inset 0 0 0 5px #777;
}

.lastMove{
    box-shadow:inset 0 0 0 5px #aaa;
}

.legalMove::after{
    content:"";
    position:absolute;
    width:18%;
    height:18%;
    border-radius:50%;
    background:#777;
    z-index:2;
}

.captureMove::after{
    content:"";
    position:absolute;
    width:72%;
    height:72%;
    border:5px solid #777;
    border-radius:50%;
    z-index:2;
}

.checkSquare{
    background:#555 !important;
}

/* BOTTOM */

.bottom{
    margin-top:18px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    padding:12px 20px;
    border-radius:11px;
    background:#fff;
    color:#000;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    transition:.15s;
}

.btn:hover{
    background:#ddd;
    transform:translateY(-1px);
}

.btn.dark{
    background:#222;
    color:#fff;
    border:1px solid #444;
}

.btn.dark:hover{
    background:#333;
}

.tip{
    text-align:center;
    margin-top:12px;
    color:#777;
    font-size:12px;
}

/* PROMOTION */

.promotionOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    backdrop-filter:blur(8px);
}

.promotionBox{
    width:min(90%,390px);
    background:#fff;
    color:#000;
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 25px 80px rgba(0,0,0,.7);
    animation:pop .25s ease;
}

@keyframes pop{
    from{
        transform:scale(.85);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.promotionBox h2{
    margin:0 0 5px;
}

.promotionBox p{
    color:#666;
    margin-top:5px;
}

.promotionChoices{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:20px;
}

.promotionChoices button{
    border:2px solid #000;
    background:#fff;
    border-radius:12px;
    font-size:42px;
    padding:12px;
    cursor:pointer;
}

.promotionChoices button:hover{
    background:#000;
    color:#fff;
}

/* AI THINKING */

.aiThinking{
    animation:thinking 1s infinite;
}

@keyframes thinking{
    0%,100%{
        opacity:1;
    }
    50%{
        opacity:.45;
    }
}

/* MOBILE */

@media(max-width:850px){

    body{
        align-items:flex-start;
    }

    .gameLayout{
        grid-template-columns:1fr;
    }

    .boardWrap{
        order:1;
    }

    .playerCard{
        min-height:auto;
        width:100%;
    }

    .whiteCard{
        order:2;
    }

    .blackCard{
        order:3;
    }

    .topbar{
        flex-direction:column;
    }

    .status{
        width:100%;
    }
}

@media(max-width:500px){

    .app{
        padding:10px;
    }

    #board{
        border-width:3px;
    }

    .playerCard{
        padding:12px;
    }

    .piece{
        font-size:clamp(30px,10vw,48px);
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="topbar">

        <div class="logo">
            ♟ SolveItAI
            <span>Chess</span>
            <span id="modeBadge" class="modeBadge"></span>
        </div>

        <div class="status" id="status">
            White to move
        </div>

    </div>


    <div class="gameLayout">

        <!-- WHITE -->

        <div class="playerCard whiteCard">

            <div class="playerTop">

                <div class="playerIcon">
                    ♔
                </div>

                <div>

                    <div
                        class="playerName"
                        id="whiteName">
                        White
                    </div>

                    <div
                        class="playerSide"
                        id="whiteSide">
                        Player 1
                    </div>

                </div>

            </div>

            <div class="captureTitle">
                Captured
            </div>

            <div
                class="captured"
                id="whiteCaptured">
                —
            </div>

            <div class="count">
                Captured pieces:
                <b id="whiteCount">0</b>
            </div>

            <div class="score">
                Material:
                <span id="whiteScore">0</span>
            </div>

        </div>


        <!-- BOARD -->

        <div class="boardWrap">
            <div id="board"></div>
        </div>


        <!-- BLACK -->

        <div class="playerCard blackCard">

            <div class="playerTop">

                <div class="playerIcon">
                    ♚
                </div>

                <div>

                    <div
                        class="playerName"
                        id="blackName">
                        Black
                    </div>

                    <div
                        class="playerSide"
                        id="blackSide">
                        Player 2
                    </div>

                </div>

            </div>

            <div class="captureTitle">
                Captured
            </div>

            <div
                class="captured"
                id="blackCaptured">
                —
            </div>

            <div class="count">
                Captured pieces:
                <b id="blackCount">0</b>
            </div>

            <div class="score">
                Material:
                <span id="blackScore">0</span>
            </div>

        </div>

    </div>


    <div class="bottom">

        <button
            class="btn"
            onclick="newGame()">
            ↻ New Game
        </button>

        <button
            class="btn dark"
            onclick="goBack()">
            ← Game Mode
        </button>

    </div>

    <div class="tip">
        Select a piece to see legal moves
    </div>

</div>


<!-- PROMOTION -->

<div
    class="promotionOverlay"
    id="promotionOverlay">

    <div class="promotionBox">

        <h2>Choose Promotion</h2>

        <p>Select your new piece</p>

        <div class="promotionChoices">

            <button onclick="choosePromotion('q')">
                ♕
            </button>

            <button onclick="choosePromotion('r')">
                ♖
            </button>

            <button onclick="choosePromotion('b')">
                ♗
            </button>

            <button onclick="choosePromotion('n')">
                ♘
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================
   MODE
========================================= */

const gameMode =
    new URLSearchParams(
        window.location.search
    ).get("mode");

let aiMode = gameMode === "ai";

const aiColor = "b";

let aiThinking = false;


/* =========================================
   PIECES
========================================= */

const PIECES = {

    w:{
        k:"♔",
        q:"♕",
        r:"♖",
        b:"♗",
        n:"♘",
        p:"♙"
    },

    b:{
        k:"♚",
        q:"♛",
        r:"♜",
        b:"♝",
        n:"♞",
        p:"♟"
    }

};


const VALUES = {

    p:1,
    n:3,
    b:3,
    r:5,
    q:9,
    k:0

};


/* =========================================
   GAME STATE
========================================= */

let board;
let turn;

let castling;
let enPassant;

let halfmove;
let fullmove;

let selected = null;
let legalMoves = [];

let lastMove = null;

let gameOver = false;

let pendingPromotion = null;

let captured = {
    w:[],
    b:[]
};


/* =========================================
   CREATE BOARD
========================================= */

function createBoard(){

    const b =
        Array.from(
            {length:8},
            ()=>Array(8).fill(null)
        );

    const back =
        ["r","n","b","q","k","b","n","r"];

    for(let c=0;c<8;c++){

        b[0][c]={
            c:"b",
            t:back[c]
        };

        b[1][c]={
            c:"b",
            t:"p"
        };

        b[6][c]={
            c:"w",
            t:"p"
        };

        b[7][c]={
            c:"w",
            t:back[c]
        };

    }

    return b;
}


/* =========================================
   NEW GAME
========================================= */

function newGame(){

    board=createBoard();

    turn="w";

    castling={
        w:{
            k:true,
            q:true
        },
        b:{
            k:true,
            q:true
        }
    };

    enPassant=null;

    halfmove=0;
    fullmove=1;

    selected=null;
    legalMoves=[];

    lastMove=null;

    gameOver=false;

    pendingPromotion=null;

    aiThinking=false;

    captured={
        w:[],
        b:[]
    };

    document.getElementById(
        "promotionOverlay"
    ).style.display="none";


    if(aiMode){

        document.getElementById(
            "whiteName"
        ).textContent="You";

        document.getElementById(
            "whiteSide"
        ).textContent="Player";


        document.getElementById(
            "blackName"
        ).textContent="SolveItAI";

        document.getElementById(
            "blackSide"
        ).textContent="AI Opponent";

        document.getElementById(
            "modeBadge"
        ).textContent="AI";

    }else{

        document.getElementById(
            "whiteName"
        ).textContent="White";

        document.getElementById(
            "whiteSide"
        ).textContent="Player 1";


        document.getElementById(
            "blackName"
        ).textContent="Black";

        document.getElementById(
            "blackSide"
        ).textContent="Player 2";

        document.getElementById(
            "modeBadge"
        ).textContent="DUO";
    }


    render();
}


/* =========================================
   HELPERS
========================================= */

function inside(r,c){

    return (
        r>=0 &&
        r<8 &&
        c>=0 &&
        c<8
    );
}


function opposite(color){

    return color==="w"
        ? "b"
        : "w";
}


function cloneBoard(b){

    return b.map(
        row =>
            row.map(
                p =>
                    p
                    ? {...p}
                    : null
            )
    );
}


function findKing(b,color){

    for(let r=0;r<8;r++){

        for(let c=0;c<8;c++){

            const p=b[r][c];

            if(
                p &&
                p.c===color &&
                p.t==="k"
            ){
                return {r,c};
            }

        }

    }

    return null;
}


/* =========================================
   ATTACK DETECTION
========================================= */

function isSquareAttacked(
    b,
    r,
    c,
    byColor
){

    /* PAWN */

    const pawnRow =
        byColor==="w"
        ? r+1
        : r-1;

    for(
        const dc of [-1,1]
    ){

        const pc=c+dc;

        if(!inside(pawnRow,pc))
            continue;

        const p=b[pawnRow][pc];

        if(
            p &&
            p.c===byColor &&
            p.t==="p"
        ){
            return true;
        }
    }


    /* KNIGHT */

    const knight=[
        [-2,-1],
        [-2,1],
        [-1,-2],
        [-1,2],
        [1,-2],
        [1,2],
        [2,-1],
        [2,1]
    ];

    for(
        const [dr,dc] of knight
    ){

        const nr=r+dr;
        const nc=c+dc;

        if(!inside(nr,nc))
            continue;

        const p=b[nr][nc];

        if(
            p &&
            p.c===byColor &&
            p.t==="n"
        ){
            return true;
        }
    }


    /* KING */

    for(let dr=-1;dr<=1;dr++){

        for(let dc=-1;dc<=1;dc++){

            if(
                dr===0 &&
                dc===0
            )
                continue;

            const nr=r+dr;
            const nc=c+dc;

            if(!inside(nr,nc))
                continue;

            const p=b[nr][nc];

            if(
                p &&
                p.c===byColor &&
                p.t==="k"
            ){
                return true;
            }
        }
    }


    /* ROOK / QUEEN */

    const straight=[
        [-1,0],
        [1,0],
        [0,-1],
        [0,1]
    ];

    for(
        const [dr,dc] of straight
    ){

        let nr=r+dr;
        let nc=c+dc;

        while(inside(nr,nc)){

            const p=b[nr][nc];

            if(p){

                if(
                    p.c===byColor &&
                    (
                        p.t==="r" ||
                        p.t==="q"
                    )
                ){
                    return true;
                }

                break;
            }

            nr+=dr;
            nc+=dc;
        }
    }


    /* BISHOP / QUEEN */

    const diagonal=[
        [-1,-1],
        [-1,1],
        [1,-1],
        [1,1]
    ];

    for(
        const [dr,dc] of diagonal
    ){

        let nr=r+dr;
        let nc=c+dc;

        while(inside(nr,nc)){

            const p=b[nr][nc];

            if(p){

                if(
                    p.c===byColor &&
                    (
                        p.t==="b" ||
                        p.t==="q"
                    )
                ){
                    return true;
                }

                break;
            }

            nr+=dr;
            nc+=dc;
        }
    }

    return false;
}


function isInCheck(b,color){

    const king=findKing(
        b,
        color
    );

    if(!king)
        return true;

    return isSquareAttacked(
        b,
        king.r,
        king.c,
        opposite(color)
    );
}


/* =========================================
   MOVE GENERATION
========================================= */

function addMove(
    list,
    from,
    to,
    extra={}
){

    list.push({
        from:{...from},
        to:{...to},
        ...extra
    });
}


function generatePseudoMoves(
    state,
    color
){

    const b=state.board;

    const moves=[];


    for(let r=0;r<8;r++){

        for(let c=0;c<8;c++){

            const p=b[r][c];

            if(
                !p ||
                p.c!==color
            )
                continue;

            const from={r,c};


            /* PAWN */

            if(p.t==="p"){

                const dir =
                    color==="w"
                    ? -1
                    : 1;

                const start =
                    color==="w"
                    ? 6
                    : 1;

                const promotionRow =
                    color==="w"
                    ? 0
                    : 7;

                const one=r+dir;


                if(
                    inside(one,c) &&
                    !b[one][c]
                ){

                    if(
                        one===promotionRow
                    ){

                        for(
                            const promotion of
                            ["q","r","b","n"]
                        ){

                            addMove(
                                moves,
                                from,
                                {
                                    r:one,
                                    c
                                },
                                {promotion}
                            );
                        }

                    }else{

                        addMove(
                            moves,
                            from,
                            {
                                r:one,
                                c
                            }
                        );


                        const two=r+dir*2;

                        if(
                            r===start &&
                            inside(two,c) &&
                            !b[two][c]
                        ){

                            addMove(
                                moves,
                                from,
                                {
                                    r:two,
                                    c
                                },
                                {
                                    doublePawn:true
                                }
                            );
                        }
                    }
                }


                /* PAWN CAPTURE */

                for(
                    const dc of [-1,1]
                ){

                    const nr=r+dir;
                    const nc=c+dc;

                    if(!inside(nr,nc))
                        continue;

                    const target=b[nr][nc];


                    if(
                        target &&
                        target.c!==color &&
                        target.t!=="k"
                    ){

                        if(
                            nr===promotionRow
                        ){

                            for(
                                const promotion of
                                ["q","r","b","n"]
                            ){

                                addMove(
                                    moves,
                                    from,
                                    {
                                        r:nr,
                                        c:nc
                                    },
                                    {promotion}
                                );
                            }

                        }else{

                            addMove(
                                moves,
                                from,
                                {
                                    r:nr,
                                    c:nc
                                }
                            );
                        }
                    }


                    /* EN PASSANT */

                    if(
                        state.enPassant &&
                        state.enPassant.r===nr &&
                        state.enPassant.c===nc
                    ){

                        addMove(
                            moves,
                            from,
                            {
                                r:nr,
                                c:nc
                            },
                            {
                                enPassant:true
                            }
                        );
                    }
                }
            }


            /* KNIGHT */

            if(p.t==="n"){

                const jumps=[
                    [-2,-1],
                    [-2,1],
                    [-1,-2],
                    [-1,2],
                    [1,-2],
                    [1,2],
                    [2,-1],
                    [2,1]
                ];

                for(
                    const [dr,dc] of jumps
                ){

                    const nr=r+dr;
                    const nc=c+dc;

                    if(!inside(nr,nc))
                        continue;

                    if(
                        !b[nr][nc] ||
                        (
                            b[nr][nc].c!==color &&
                            b[nr][nc].t!=="k"
                        )
                    ){

                        addMove(
                            moves,
                            from,
                            {
                                r:nr,
                                c:nc
                            }
                        );
                    }
                }
            }


            /* BISHOP / ROOK / QUEEN */

            if(
                p.t==="b" ||
                p.t==="r" ||
                p.t==="q"
            ){

                const dirs=[];

                if(
                    p.t==="b" ||
                    p.t==="q"
                ){

                    dirs.push(
                        [-1,-1],
                        [-1,1],
                        [1,-1],
                        [1,1]
                    );
                }

                if(
                    p.t==="r" ||
                    p.t==="q"
                ){

                    dirs.push(
                        [-1,0],
                        [1,0],
                        [0,-1],
                        [0,1]
                    );
                }


                for(
                    const [dr,dc] of dirs
                ){

                    let nr=r+dr;
                    let nc=c+dc;

                    while(
                        inside(nr,nc)
                    ){

                        if(!b[nr][nc]){

                            addMove(
                                moves,
                                from,
                                {
                                    r:nr,
                                    c:nc
                                }
                            );

                        }else{

                            if(
                                b[nr][nc].c!==color &&
                                b[nr][nc].t!=="k"
                            ){

                                addMove(
                                    moves,
                                    from,
                                    {
                                        r:nr,
                                        c:nc
                                    }
                                );
                            }

                            break;
                        }

                        nr+=dr;
                        nc+=dc;
                    }
                }
            }


            /* KING */

            if(p.t==="k"){

                for(let dr=-1;dr<=1;dr++){

                    for(let dc=-1;dc<=1;dc++){

                        if(
                            dr===0 &&
                            dc===0
                        )
                            continue;

                        const nr=r+dr;
                        const nc=c+dc;

                        if(!inside(nr,nc))
                            continue;

                        if(
                            !b[nr][nc] ||
                            (
                                b[nr][nc].c!==color &&
                                b[nr][nc].t!=="k"
                            )
                        ){

                            addMove(
                                moves,
                                from,
                                {
                                    r:nr,
                                    c:nc
                                }
                            );
                        }
                    }
                }


                /* CASTLING */

                const home =
                    color==="w"
                    ? 7
                    : 0;


                /* KING SIDE */

                if(
                    r===home &&
                    c===4 &&
                    state.castling[color].k &&
                    b[home][7] &&
                    b[home][7].c===color &&
                    b[home][7].t==="r" &&
                    !b[home][5] &&
                    !b[home][6] &&
                    !isSquareAttacked(
                        b,
                        home,
                        4,
                        opposite(color)
                    ) &&
                    !isSquareAttacked(
                        b,
                        home,
                        5,
                        opposite(color)
                    ) &&
                    !isSquareAttacked(
                        b,
                        home,
                        6,
                        opposite(color)
                    )
                ){

                    addMove(
                        moves,
                        from,
                        {
                            r:home,
                            c:6
                        },
                        {
                            castle:"k"
                        }
                    );
                }


                /* QUEEN SIDE */

                if(
                    r===home &&
                    c===4 &&
                    state.castling[color].q &&
                    b[home][0] &&
                    b[home][0].c===color &&
                    b[home][0].t==="r" &&
                    !b[home][1] &&
                    !b[home][2] &&
                    !b[home][3] &&
                    !isSquareAttacked(
                        b,
                        home,
                        4,
                        opposite(color)
                    ) &&
                    !isSquareAttacked(
                        b,
                        home,
                        3,
                        opposite(color)
                    ) &&
                    !isSquareAttacked(
                        b,
                        home,
                        2,
                        opposite(color)
                    )
                ){

                    addMove(
                        moves,
                        from,
                        {
                            r:home,
                            c:2
                        },
                        {
                            castle:"q"
                        }
                    );
                }
            }

        }
    }

    return moves;
}


/* =========================================
   APPLY MOVE
========================================= */

function applyMove(
    state,
    move
){

    const ns={

        board:cloneBoard(
            state.board
        ),

        turn:state.turn,

        castling:{
            w:{...state.castling.w},
            b:{...state.castling.b}
        },

        enPassant:
            state.enPassant
            ? {...state.enPassant}
            : null,

        halfmove:state.halfmove,
        fullmove:state.fullmove
    };


    const b=ns.board;

    const piece =
        b[move.from.r][move.from.c];

    const capturedPiece =
        b[move.to.r][move.to.c];


    if(
        piece.t==="p" ||
        capturedPiece ||
        move.enPassant
    ){

        ns.halfmove=0;

    }else{

        ns.halfmove++;
    }


    b[move.from.r][move.from.c]=null;


    /* EN PASSANT */

    if(move.enPassant){

        const captureRow =
            move.to.r +
            (
                piece.c==="w"
                ? 1
                : -1
            );

        b[captureRow][move.to.c]=null;
    }


    let newPiece={
        ...piece
    };


    if(move.promotion){

        newPiece.t=move.promotion;
    }


    b[move.to.r][move.to.c]=newPiece;


    /* CASTLING */

    if(move.castle){

        const row =
            piece.c==="w"
            ? 7
            : 0;


        if(move.castle==="k"){

            b[row][7]=null;

            b[row][5]={
                c:piece.c,
                t:"r"
            };

        }else{

            b[row][0]=null;

            b[row][3]={
                c:piece.c,
                t:"r"
            };
        }
    }


    /* KING MOVED */

    if(piece.t==="k"){

        ns.castling[piece.c].k=false;
        ns.castling[piece.c].q=false;
    }


    /* ROOK MOVED */

    if(piece.t==="r"){

        if(
            piece.c==="w" &&
            move.from.r===7 &&
            move.from.c===7
        ){
            ns.castling.w.k=false;
        }

        if(
            piece.c==="w" &&
            move.from.r===7 &&
            move.from.c===0
        ){
            ns.castling.w.q=false;
        }

        if(
            piece.c==="b" &&
            move.from.r===0 &&
            move.from.c===7
        ){
            ns.castling.b.k=false;
        }

        if(
            piece.c==="b" &&
            move.from.r===0 &&
            move.from.c===0
        ){
            ns.castling.b.q=false;
        }
    }


    /* ROOK CAPTURED */

    if(
        capturedPiece &&
        capturedPiece.t==="r"
    ){

        if(
            capturedPiece.c==="w" &&
            move.to.r===7 &&
            move.to.c===7
        ){
            ns.castling.w.k=false;
        }

        if(
            capturedPiece.c==="w" &&
            move.to.r===7 &&
            move.to.c===0
        ){
            ns.castling.w.q=false;
        }

        if(
            capturedPiece.c==="b" &&
            move.to.r===0 &&
            move.to.c===7
        ){
            ns.castling.b.k=false;
        }

        if(
            capturedPiece.c==="b" &&
            move.to.r===0 &&
            move.to.c===0
        ){
            ns.castling.b.q=false;
        }
    }


    /* EN PASSANT TARGET */

    ns.enPassant=null;

    if(
        piece.t==="p" &&
        Math.abs(
            move.to.r-move.from.r
        )===2
    ){

        ns.enPassant={
            r:
                (
                    move.from.r+
                    move.to.r
                )/2,
            c:move.from.c
        };
    }


    if(piece.c==="b"){
        ns.fullmove++;
    }


    ns.turn=opposite(piece.c);

    return ns;
}


/* =========================================
   LEGAL MOVES
========================================= */

function getLegalMoves(
    state,
    color
){

    const pseudo =
        generatePseudoMoves(
            state,
            color
        );

    return pseudo.filter(
        move => {

            const next =
                applyMove(
                    state,
                    move
                );

            return !isInCheck(
                next.board,
                color
            );
        }
    );
}


/* =========================================
   CAPTURE TRACKING
========================================= */

function recordCapture(
    moverColor,
    capturedPiece
){

    if(!capturedPiece)
        return;

    captured[moverColor].push(
        capturedPiece.t
    );
}


function renderCaptures(){

    const whiteBox =
        document.getElementById(
            "whiteCaptured"
        );

    const blackBox =
        document.getElementById(
            "blackCaptured"
        );


    whiteBox.innerHTML =
        captured.w.length
        ? captured.w
            .map(
                p=>PIECES.b[p]
            )
            .join(" ")
        : "—";


    blackBox.innerHTML =
        captured.b.length
        ? captured.b
            .map(
                p=>PIECES.w[p]
            )
            .join(" ")
        : "—";


    document.getElementById(
        "whiteCount"
    ).textContent =
        captured.w.length;


    document.getElementById(
        "blackCount"
    ).textContent =
        captured.b.length;


    const whiteScore =
        captured.w.reduce(
            (sum,p)=>
                sum+VALUES[p],
            0
        );


    const blackScore =
        captured.b.reduce(
            (sum,p)=>
                sum+VALUES[p],
            0
        );


    document.getElementById(
        "whiteScore"
    ).textContent =
        whiteScore;


    document.getElementById(
        "blackScore"
    ).textContent =
        blackScore;
}


/* =========================================
   STATUS
========================================= */

function updateStatus(){

    const status =
        document.getElementById(
            "status"
        );


    const state={
        board,
        turn,
        castling,
        enPassant,
        halfmove,
        fullmove
    };


    const legal =
        getLegalMoves(
            state,
            turn
        );


    const check =
        isInCheck(
            board,
            turn
        );


    if(legal.length===0){

        gameOver=true;

        if(check){

            status.textContent =
                turn==="w"
                ? "♚ Checkmate — Black Wins"
                : "♔ Checkmate — White Wins";

        }else{

            status.textContent =
                "Draw — Stalemate";
        }

        return;
    }


    if(halfmove>=100){

        gameOver=true;

        status.textContent =
            "Draw — 50 Move Rule";

        return;
    }


    if(aiThinking){

        status.textContent =
            "🤖 SolveItAI is thinking...";

        return;
    }


    if(check){

        status.textContent =
            turn==="w"
            ? "⚠ White is in Check"
            : "⚠ Black is in Check";

    }else{

        if(aiMode){

            status.textContent =
                turn==="w"
                ? "Your turn"
                : "SolveItAI's turn";

        }else{

            status.textContent =
                turn==="w"
                ? "White to move"
                : "Black to move";
        }
    }
}


/* =========================================
   CLICK
========================================= */

function handleSquareClick(
    r,
    c
){

    if(
        gameOver ||
        pendingPromotion ||
        aiThinking ||
        (
            aiMode &&
            turn===aiColor
        )
    ){
        return;
    }


    const piece=board[r][c];


    if(selected){

        const move =
            legalMoves.find(
                m =>
                    m.to.r===r &&
                    m.to.c===c
            );


        if(move){

            if(move.promotion){

                pendingPromotion=move;

                document.getElementById(
                    "promotionOverlay"
                ).style.display="flex";

                return;
            }

            makeMove(move);

            return;
        }


        if(
            piece &&
            piece.c===turn
        ){

            selectPiece(r,c);

            return;
        }


        selected=null;
        legalMoves=[];

        render();

        return;
    }


    if(
        piece &&
        piece.c===turn
    ){

        selectPiece(r,c);
    }
}


/* =========================================
   SELECT PIECE
========================================= */

function selectPiece(r,c){

    selected={r,c};


    const state={
        board,
        turn,
        castling,
        enPassant,
        halfmove,
        fullmove
    };


    legalMoves =
        getLegalMoves(
            state,
            turn
        ).filter(
            m =>
                m.from.r===r &&
                m.from.c===c
        );


    render();
}


/* =========================================
   MAKE MOVE
========================================= */

function makeMove(move){

    const state={
        board,
        turn,
        castling,
        enPassant,
        halfmove,
        fullmove
    };


    const movingPiece =
        board[
            move.from.r
        ][
            move.from.c
        ];


    let capturedPiece =
        board[
            move.to.r
        ][
            move.to.c
        ];


    /* EN PASSANT CAPTURE */

    if(move.enPassant){

        const captureRow =
            move.to.r +
            (
                movingPiece.c==="w"
                ? 1
                : -1
            );


        capturedPiece =
            board[
                captureRow
            ][
                move.to.c
            ];
    }


    if(capturedPiece){

        recordCapture(
            movingPiece.c,
            capturedPiece
        );
    }


    const next =
        applyMove(
            state,
            move
        );


    board=next.board;
    turn=next.turn;

    castling=next.castling;

    enPassant=next.enPassant;

    halfmove=next.halfmove;
    fullmove=next.fullmove;

    lastMove=move;

    selected=null;
    legalMoves=[];

    pendingPromotion=null;


    document.getElementById(
        "promotionOverlay"
    ).style.display="none";


    render();


    /* AI TURN */

    if(
        aiMode &&
        turn===aiColor &&
        !gameOver
    ){

        setTimeout(
            makeAIMove,
            350
        );
    }
}


/* =========================================
   PROMOTION
========================================= */

function choosePromotion(piece){

    if(!pendingPromotion)
        return;


    const move={
        ...pendingPromotion,
        promotion:piece
    };


    makeMove(move);
}


/* =========================================
   RENDER
========================================= */

function render(){

    const boardElement =
        document.getElementById(
            "board"
        );


    boardElement.innerHTML="";


    for(let r=0;r<8;r++){

        for(let c=0;c<8;c++){

            const square =
                document.createElement(
                    "div"
                );


            square.className =
                "square " +
                (
                    (r+c)%2===0
                    ? "whiteSquare"
                    : "blackSquare"
                );


            /* LAST MOVE */

            if(
                lastMove &&
                (
                    (
                        lastMove.from.r===r &&
                        lastMove.from.c===c
                    ) ||
                    (
                        lastMove.to.r===r &&
                        lastMove.to.c===c
                    )
                )
            ){

                square.classList.add(
                    "lastMove"
                );
            }


            /* SELECTED */

            if(
                selected &&
                selected.r===r &&
                selected.c===c
            ){

                square.classList.add(
                    "selected"
                );
            }


            /* LEGAL MOVE */

            const legal =
                legalMoves.find(
                    m =>
                        m.to.r===r &&
                        m.to.c===c
                );


            if(legal){

                if(board[r][c]){

                    square.classList.add(
                        "captureMove"
                    );

                }else{

                    square.classList.add(
                        "legalMove"
                    );
                }
            }


            /* CHECK */

            const p=board[r][c];


            if(
                p &&
                p.t==="k" &&
                p.c===turn &&
                isInCheck(
                    board,
                    turn
                )
            ){

                square.classList.add(
                    "checkSquare"
                );
            }


            /* PIECE */

            if(p){

                const piece =
                    document.createElement(
                        "span"
                    );


                piece.className =
                    "piece " +
                    (
                        p.c==="w"
                        ? "whitePiece"
                        : "blackPiece"
                    );


                piece.textContent =
                    PIECES[p.c][p.t];


                square.appendChild(
                    piece
                );
            }


            square.addEventListener(
                "click",
                () => {

                    handleSquareClick(
                        r,
                        c
                    );
                }
            );


            boardElement.appendChild(
                square
            );
        }
    }


    renderCaptures();

    updateStatus();
}


/* =========================================
   SOLVEITAI ENGINE
========================================= */

const AI_DEPTH = 2;


/* BOARD EVALUATION */

function evaluateBoard(b){

    let score=0;


    for(let r=0;r<8;r++){

        for(let c=0;c<8;c++){

            const p=b[r][c];

            if(!p)
                continue;


            let value=VALUES[p.t];


            /*
              Small center bonus.
              This makes AI prefer active pieces.
            */

            if(
                r>=2 &&
                r<=5 &&
                c>=2 &&
                c<=5
            ){

                if(
                    p.t==="p" ||
                    p.t==="n" ||
                    p.t==="b"
                ){

                    value+=0.15;
                }
            }


            if(p.c===aiColor){

                score+=value;

            }else{

                score-=value;
            }
        }
    }


    return score;
}


/* MINIMAX */

function minimax(
    state,
    depth,
    alpha,
    beta
){

    const legal =
        getLegalMoves(
            state,
            state.turn
        );


    const inCheck =
        isInCheck(
            state.board,
            state.turn
        );


    /* CHECKMATE / STALEMATE */

    if(legal.length===0){

        if(inCheck){

            if(
                state.turn===aiColor
            ){

                return -100000-depth;

            }else{

                return 100000+depth;
            }
        }

        return 0;
    }


    if(depth===0){

        return evaluateBoard(
            state.board
        );
    }


    const maximizing =
        state.turn===aiColor;


    if(maximizing){

        let best=-Infinity;


        for(const move of legal){

            const next =
                applyMove(
                    state,
                    move
                );


            const value =
                minimax(
                    next,
                    depth-1,
                    alpha,
                    beta
                );


            best=Math.max(
                best,
                value
            );


            alpha=Math.max(
                alpha,
                value
            );


            if(beta<=alpha)
                break;
        }


        return best;

    }else{

        let best=Infinity;


        for(const move of legal){

            const next =
                applyMove(
                    state,
                    move
                );


            const value =
                minimax(
                    next,
                    depth-1,
                    alpha,
                    beta
                );


            best=Math.min(
                best,
                value
            );


            beta=Math.min(
                beta,
                value
            );


            if(beta<=alpha)
                break;
        }


        return best;
    }
}


/* FIND BEST AI MOVE */

function findBestAIMove(){

    const state={

        board,
        turn,
        castling,
        enPassant,
        halfmove,
        fullmove

    };


    const moves =
        getLegalMoves(
            state,
            aiColor
        );


    if(!moves.length)
        return null;


    let bestScore=-Infinity;

    let bestMoves=[];


    for(const move of moves){

        const next =
            applyMove(
                state,
                move
            );


        const score =
            minimax(
                next,
                AI_DEPTH-1,
                -Infinity,
                Infinity
            );


        if(score>bestScore){

            bestScore=score;

            bestMoves=[
                move
            ];

        }else if(score===bestScore){

            bestMoves.push(
                move
            );
        }
    }


    /*
      If several moves are equally good,
      choose one randomly.
    */

    return bestMoves[
        Math.floor(
            Math.random() *
            bestMoves.length
        )
    ];
}


/* AI MOVE */

function makeAIMove(){

    if(
        !aiMode ||
        gameOver ||
        turn!==aiColor
    ){

        return;
    }


    aiThinking=true;

    const status =
        document.getElementById(
            "status"
        );


    status.classList.add(
        "aiThinking"
    );


    status.textContent =
        "🤖 SolveItAI is thinking...";


    setTimeout(() => {

        const move =
            findBestAIMove();


        if(move){

            aiThinking=false;

            status.classList.remove(
                "aiThinking"
            );


            makeMove(move);

        }else{

            aiThinking=false;

            status.classList.remove(
                "aiThinking"
            );

            render();
        }

    },450);
}
